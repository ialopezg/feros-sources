name: Publish released site

# Public sources are immutable between published GitHub releases.
# Drafts, pushes to main, and manual runs must not update Pages.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release matches catalog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("src/catalog.toml", "rb"))["catalog_version"])')
          test "$RELEASE_TAG" = "v$version" || {
            echo "::error::Release $RELEASE_TAG does not match catalog v$version"; exit 1;
          }
          test "$(git tag --points-at HEAD | grep -Fx "$RELEASE_TAG")" = "$RELEASE_TAG" || {
            echo "::error::Release tag does not identify checked-out commit"; exit 1;
          }
      - name: Validate sources
        run: python scripts/validate.py
      - name: Build site from release commit
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject superseded release deployments
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "::error::A newer release ($latest) is published; refusing to deploy $RELEASE_TAG"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
