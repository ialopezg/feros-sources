name: Release candidate

# Like FeROS Builder: a maintainer selects an existing version tag.
# CI validates, packages, checksums and creates a draft. Publication is separate.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate tag syntax
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify release identity and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('src/catalog.toml').read_text(encoding='utf-8'))['catalog_version']
          if tag != 'v' + version:
              raise SystemExit(f'Tag {tag} does not match catalog version {version}')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          if not re.search(r'^## \[' + re.escape(version) + r'\] - \d{4}-\d{2}-\d{2}$', changelog, re.M):
              raise SystemExit(f'Missing dated CHANGELOG.md entry for {version}')
          PY

      - name: Validate sources
        run: python scripts/validate.py

      - name: Build published snapshot and package candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          python scripts/build_site.py
          name="feros-sources-$RELEASE_TAG.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --exclude=./index.html --exclude=./.nojekyll \
            -C dist/site -cf - . | gzip -n > "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/feros-sources-$RELEASE_TAG.tar.gz" dist/SHA256SUMS \
            --verify-tag --draft --title "FeROS Sources $RELEASE_TAG" \
            --generate-notes
